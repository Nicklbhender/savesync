[workspace]
resolver = "3"
members = ["protocol", "server", "engine", "desktop", "ffi"]

[workspace.package]
version = "1.0.2"
edition = "2024"

[workspace.dependencies]
savesync-protocol = { path = "protocol" }
anyhow = "1.0.104"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"

[profile.release]
strip = true
