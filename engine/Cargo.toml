[package]
name = "savesync-engine"
description = "Client-side sync engine shared by the SaveSync desktop and Android apps"
version.workspace = true
edition.workspace = true

[features]
default = ["desktop"]
# Emulator process detection and folder watching. Android supplies its own
# equivalents (UsageStatsManager, SAF) through the platform layer instead.
desktop = ["dep:notify", "dep:sysinfo"]

[dependencies]
savesync-protocol.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
globset = "0.4.20"
notify = { version = "8.2.0", optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"], optional = true }
tokio-util = { version = "0.7.19", features = ["io"] }
rand = "0.10.3"
bytes = "1.12.1"

[dev-dependencies]
savesync-server = { path = "../server" }
tempfile.workspace = true
axum = "0.8.9"
